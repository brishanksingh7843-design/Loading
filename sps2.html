<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Brishank Singh" />
    <meta name="description" content="Something here" />
    <meta name="theme-color" content="white" />
    <meta property="og:title" content="Brish" />
    <meta
      property="og:image"
      content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZTwodOG-BpzQJZrVV8x4oa15Q-GJ4yfYBVA&s"
    />
    <link rel="icon" rel="image/png" href="BSlogo.png" />
    <title>js Learning</title>
    <style>
      html {
        scroll-behavior: smooth;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }
      body {
        /* overflow-x:none;
        overflow-y:none; */
        overflow: hidden;
        z-index: 1000;
      }
      .scene {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: black;
        background: url("sky6.avif");
        background-size: 150% 100%;
        z-index: -1;
        animation: sky 50s linear infinite;
        /* transform-origin:50% 60%; */
      }
      @keyframes sky {
        to {
          background-position: 100% 0%;
        }
      }
      .mount {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: 20%;
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.641), transparent),
          url("mountain.png");
        background-size: 100% 100%;
        /*filter:blur(1px); */
        object-fit: cover;
        z-index: 2;
        clip-path: polygon(
          0% 34%,
          16% 34%,
          16% 0%,
          100% 0%,
          100% 100%,
          0% 100%
        );
      }
      img {
        object-fit: cover;
      }
      button {
        z-index: 5000;
        width: 300px;
        aspect-ratio: 3/1;
        margin: 20px;
        font-family: sans-serif;
        font-size: 30px;
        font-weight: 700;
        border-radius: 60px 0 60px 0;
        background: linear-gradient(
          15deg,
          cyan 1%,
          red,
          blue,
          red,
          blue,
          cyan,
          red,
          blue
        );
        background-size: 100% 800%;
        color: white;
        animation: n 10s linear infinite;
        vertical-align: top;
        transition:
          font-size 0.3s,
          transform 0.1s; /* you have to put comma ,,,, */
        border: 5px solid rgba(0, 0, 0, 0.7);
        border-style: inset;
        /* dashed dotted double solid */
        /* inset outset groove  rdige */
        /* clip-path:polygon(0% 0%, 100% 50%, 0% 100%); */
        /* clip-path:polygon(0% 50%, 50% 0%, 100% 50%, 50% 100%); */
        /* Only works if your button is exactly 100px by 100px */
        /* clip-path: path("M 0 50 L 50 0 L 100 50 L 50 100 Z"); */
      }
      button:hover {
        border-style: outset;
        font-size: 35px;
        transform: scaleX(1.1);
      }
      button:hover::after {
        content: "-";
      }
      button:hover::before {
        content: "-";
      }
      button:active {
        transform: scale(0.9);
      }
      @keyframes n {
        from {
          background-position: 0% 0%;
          /* clip-path:polygon(0% 0%, 0% 100%); */
        }
        to {
          background-position: 0% 100%;
          /* clip-path:polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); */
        }
      }
      div {
        font-size: 30px;
        font-weight: bolder;
        font-family: sans-serif;
        position: relative;
        display: flex;
        justify-content: center;
        /* main this to center text horizontally is above */
        -webkit-text-stroke: 1px black;
      }
      h1,
      .result,
      .descrip,
      .details {
        background: linear-gradient(to right, white, red, cyan, blue, white);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        animation: rock 3s ease-in-out infinite;
      }
      h1:after {
        content: "";
        height: 10px;
        width: 100%;
        border-radius: 5px;
        background: linear-gradient(to right, red, cyan, blue, yellow, orange);
        display: block;
        transition: width 0.5s;
      }
      h1:hover::after {
        width: 0%;
      }
      @keyframes rock {
        50% {
          transform: scaleX(1.1);
        }
        to {
          filter: hue-rotate(360deg);
        }
      }
      .buttons {
        display: flex;
        justify-content: center;
      }
      p {
        text-align: center;
        font-size: 40px;
        /* text-decoration: underline;
        text-decoration-style: double;
        text-decoration-color: cyan;
        text-decoration-thickness: 3px;
        text-underline-offset: 4px;*/
        font-family: courier;
        font-weight: bolder;
        -webkit-text-stroke: 0px;
      }
    </style>
  </head>
  <body>
    <div class="scene"></div>
    <div class="mount"></div>
    <div><h1>Rock Paper Scissor</h1></div>
    <div classs="buttons">
      <button onclick="ab('stone')">Stone</button>
      <button onclick="ab('paper')">Paper</button>
      <button onclick="ab('scissor')">Scissor</button>
    </div>
    <p class="result">---</p>
    <p class="descrip">---</p>
    <p class="details">---</p>
    <!-- style="position: absolute; top: 50%; left: 50%; translate: -50% -50%"  i used it in reset button but no need-->

    <!-- score.win = 0;
        score.loose = 0;
        score.tie = 0; chatgpt said that it is old way and we can directly reassign the object -->

    <button
      onclick="
        score = { win: 0, loose: 0, tie: 0 };
        console.log(
          `Wins= ${score.win}, Loose= ${score.loose}, Ties= ${score.tie}`,
        );
        your = 'Nothing';
        comp = 'Nothing';
        localStorage.removeItem('localscore');
        jsupdate();
      "
    >
      Reset
    </button>
    <script>
      // alert("hello");
      // some builtin objects are console Math JSON  document object model(dom).... doucment(object).body(object).innerHTML(property)....etc
      // const score = {
      //   win: 0, //colon is used only here in objects nowhere else so remember
      //   loose: 0,
      //   tie: 0,
      // };
      console.log("Hello Everyone Let's Start The Game :-");
      let score = JSON.parse(localStorage.getItem("localscore")) || {
        win: 0,
        loose: 0,
        tie: 0,
      };
      // when the first time the code runs the localStorage will be false/null so the or operator will make the socre object and give it default values.... and next time there will be a value in local Storage so will will work
      console.log(score);
      // null behaves like false value
      // localStorage.getItem('score'); we don't want string so we will directly change it to object as we call it
      // we can add other objecs and functions inside objects called nested objectssss
      let ran = 0;
      let comp = "Nothing";
      let your = "Nothing";
      let result = "Nothing";
      function ab(ym = "") {
        your = ym;
        ran = Math.random();
        if (ran < 1 / 3) {
          comp = "stone";
        } else if (ran < 2 / 3) {
          comp = "paper";
        } else {
          comp = "scissor";
        }
        check();
      }
      function check() {
        if (your === comp) {
          result = "Tie";
          score.tie += 1;
        } else if (your === "stone" && comp === "scissor") {
          result = "Win";
          score.win += 1;
        } else if (your === "paper" && comp === "stone") {
          result = "Win";
          score.win += 1;
        } else if (your === "scissor" && comp === "paper") {
          result = "Win";
          score.win += 1;
        } else {
          result = "Loose";
          score.loose += 1;
        }
        console.log(
          `Your Move= ${your}, Computer Move= ${comp}\nThe result is: ${result}\nWins= ${score.win}, Loose= ${score.loose}, Ties= ${score.tie}`,
        );
        localStorage.setItem("localscore", JSON.stringify(score));
        jsupdate();
      }
      function jsupdate() {
        const r = document.querySelector(".result");
        const descript = document.querySelector(".descrip");
        const detail = document.querySelector(".details");
        r.innerText = result;
        descript.innerText =
          "You\t---------- A.I.\n " + your + "\t--------- " + comp;
        detail.innerText =
          "Win: " +
          score.win +
          ", Loose: " +
          score.loose +
          ", Tie: " +
          score.tie;
      }
      jsupdate();
      // localStorage.setItem("localscore", JSON.stringify(score)); i kept this at last and it was only running once so my website didn't work as expected so i have to move it in check();

      //JSON JavaScript Object Notation  JSON is better than JavaScript Object notation bec json is unversal

      //to change object into string we can use JSON.stringify('objec name here'); eg: JSON.stringify(score);

      //to change the string back to object we use JSON.parse('object name here'); eg: JSON.parse(jsonString);

      // to give values to it we use;  localStorage.setItem(name,string-value); eg: localStorage('message','hello');

      // to get values out of it we use: localStorage.getItem('name'); eg: localStorage('message');

      //to remove anything name from localStorage we use localStorage.removeItem('name');

      // localStroage is a importnat thing as i stores values inside itself and dosen't get deleted on page refresh
    </script>
  </body>
</html>
